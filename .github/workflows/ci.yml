name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Install bridge Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Prepare OCR renderer for integration tests
        shell: powershell
        run: |
          ./scripts/setup-ocr.ps1 -DataDir "$env:RUNNER_TEMP/pdf-translator-test" -Python (Get-Command python).Source -OfficialOnly
          "DSH_PDF_RUNTIME_DIR=$env:RUNNER_TEMP/pdf-translator-test/runtime" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build client bundle
        run: npm run build

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run Node tests
        run: npm test

      - name: Run Python tests
        run: |
          python -m unittest discover -s work -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s work/ocr -p "test_*.py"

      - name: Test isolated MinerU formula rendering
        shell: powershell
        run: ./scripts/test-mineru-render.ps1 -Environment "$env:RUNNER_TEMP/mineru-render-test"

      - name: Pack release artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          npm pack --pack-destination dist

      - name: Verify package contents
        shell: powershell
        run: |
          $archive = Get-ChildItem dist\*.tgz | Select-Object -First 1
          node scripts/verify-package.mjs $archive.FullName
