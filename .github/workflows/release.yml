name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify tag matches package version
        shell: powershell
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Prepare OCR renderer for integration tests
        shell: powershell
        run: |
          ./scripts/setup-ocr.ps1 -DataDir "$env:RUNNER_TEMP/pdf-translator-test" -Python (Get-Command python).Source -OfficialOnly
          "DSH_PDF_RUNTIME_DIR=$env:RUNNER_TEMP/pdf-translator-test/runtime" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build and test
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s work -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s work/ocr -p "test_*.py"

      - name: Test isolated MinerU formula rendering
        shell: powershell
        run: ./scripts/test-mineru-render.ps1 -Environment "$env:RUNNER_TEMP/mineru-render-test"

      - name: Pack release artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          npm pack --pack-destination dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $versioned = Get-ChildItem "dist\dsh-pdf-translator-$env:VERSION.tgz"
          Copy-Item $versioned.FullName (Join-Path dist 'dsh-pdf-translator.tgz')
          node scripts/verify-package.mjs $versioned.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-package.mjs (Join-Path dist 'dsh-pdf-translator.tgz')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash -Algorithm SHA256 dist\*.tgz |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist\SHA256SUMS.txt -Encoding ascii

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(env.VERSION, '-') }}
          body_path: .github/RELEASE_NOTES.md
          files: |
            dist/dsh-pdf-translator.tgz
            dist/dsh-pdf-translator-${{ env.VERSION }}.tgz
            dist/SHA256SUMS.txt
          generate_release_notes: true

      - name: Publish to npm
        if: startsWith(env.NODE_AUTH_TOKEN, 'npm_')
        shell: powershell
        run: |
          $tarball = (Resolve-Path "dist/dsh-pdf-translator-$env:VERSION.tgz").Path
          $distTag = if ($env:VERSION.Contains('-')) { 'next' } else { 'latest' }
          npm publish "$tarball" --tag $distTag --provenance --access public --registry https://registry.npmjs.org/

      - name: Note missing npm token
        if: ${{ !startsWith(env.NODE_AUTH_TOKEN, 'npm_') }}
        shell: powershell
        run: Write-Host '::warning::NPM_TOKEN is not a valid npm token; GitHub Release was created, npm was not published.'
